[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ironlogic"
version = "0.1.0"
description = "IronLogic — игра-битва программируемых роботов. Пиши робота на Python и побеждай логикой."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ironlogic = "ironlogic.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["ironlogic", "ironlogic.engine", "ironlogic.botapi", "ironlogic.app"]